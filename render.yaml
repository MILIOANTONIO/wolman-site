services:
  - type: web
    name: wolman-site
    runtime: python
    plan: free
    rootDir: wolman-site
    buildCommand: "pip install -r server/requirements.txt"
    startCommand: "python server/chat_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false

  - type: web
    name: unitel-1mobile-webhook
    runtime: python
    plan: free
    rootDir: unitel-1mobile
    buildCommand: "pip install -r server/requirements.txt"
    startCommand: "python server/webhook_server.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: RESEND_API_KEY
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: UNITEL_NOTIFY_EMAIL
        sync: false

  - type: web
    name: pizza-saas-backend
    runtime: python
    plan: starter        # non "free": gestisce chiamate telefoniche/webhook live, non puo' "addormentarsi"
    rootDir: pizza-saas/backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: pizza-saas-db, property: connectionString }
      - key: FRONTEND_URL
        value: https://pizza-saas-frontend.onrender.com
      - key: SESSION_SECRET_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_WEBHOOK_SECRET
        sync: false
      - key: ELEVENLABS_RESERVATION_TOOL_ID
        sync: false
      - key: ELEVENLABS_ORDER_TOOL_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: DIDWW_API_KEY
        sync: false
      - key: DIDWW_ENVIRONMENT
        value: production
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY_RAW_B64URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_CONTACT_EMAIL
        sync: false
    disk:
      name: pizza-saas-uploads
      mountPath: /opt/render/project/src/pizza-saas/backend/uploads
      sizeGB: 1

  - type: web
    name: pizza-saas-frontend
    runtime: node
    plan: starter
    rootDir: pizza-saas/frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://pizza-saas-backend.onrender.com
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false

databases:
  - name: pizza-saas-db
    plan: starter
